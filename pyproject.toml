[project]
name = "ct_datalake"
authors = [
    { name = "CT Group", email = "dev@ctgroup.vn" }
]
description = "AI Candidate Search System — Semantic Search, JD Matching & G600 Analysis"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "openai>=1.0.0",
    "faiss-cpu>=1.7.0",
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
    "deep-translator>=1.9.0",
    "PyMuPDF>=1.23.0",
    "pypdf>=3.0.0",
    "python-docx>=0.8.11",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["ct_datalake"]

[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[deploy.dependencies.apt]
packages = []

[tool.ct_template]
prefix           = "DL"
module           = "CT DataLake"
app_name         = "ct_datalake"
app_slug         = "ct_datalake"
get_context_file = "ct_datalake/ct_datalake/api.py"
context_url      = "/api/method/ct_datalake.ct_datalake.api.get_context"
frontend_src     = "frontend/"

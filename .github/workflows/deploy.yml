name: Deploy Frappe Apps

on:
  push:
    branches:
      - uat
      - master

jobs:
  deploy-uat:
    if: github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to UAT Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.UAT_SERVER_IP }}
          username: root
          password: ${{ secrets.UAT_SERVER_PASSWORD }}
          script: |
            su - frappe -c "/home/frappe/deploy.sh ct_datalake uat uatapp.ctpai.vn"

  deploy-prod:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to PROD Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          script: |
            su - frappe -c "/home/frappe/deploy.sh ct_datalake master app.ctpai.vn"

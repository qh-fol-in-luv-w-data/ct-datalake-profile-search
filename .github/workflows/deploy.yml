name: Deploy Frappe Apps

on:
  push:
    branches:
      - uat
      - master

jobs:
  deploy-uat:
    if: github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to UAT Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.UAT_SERVER_IP }}
          username: root
          key: ${{ secrets.UAT_SERVER_SSH_KEY }}
          script: |
            su - frappe -c '
              export PATH=$PATH:/home/frappe/.local/bin
              source /home/frappe/frappe-env/bin/activate
              if [ ! -d "/home/frappe/frappe-bench/apps/ct_datalake" ]; then
                  echo "🚀 App ct_datalake chưa tồn tại. Đang tự động clone và cài đặt vào UAT..."
                  cd /home/frappe/frappe-bench/apps
                  git clone -b uat https://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@github.com/CTGroup-DAIT/2as-master-profile.git ct_datalake
                  cd /home/frappe/frappe-bench
                  ./env/bin/pip install -q -U -e ./apps/ct_datalake
                  if ! grep -q "^ct_datalake$" sites/apps.txt; then echo "ct_datalake" >> sites/apps.txt; fi
                  bench --site uatapp.ctpai.vn install-app ct_datalake
              fi
              cd /home/frappe/frappe-bench/apps/ct_datalake
              git clean -fd
              /home/frappe/deploy.sh ct_datalake uat uatapp.ctpai.vn
              FRONTEND_DIR=/home/frappe/frappe-bench/apps/ct_datalake/frontend
              if [ -d "$FRONTEND_DIR" ]; then
                  echo "📦 Phát hiện thư mục frontend độc lập, đang build..."
                  cd "$FRONTEND_DIR"
                  npm install
                  npm run build
                  cd /home/frappe/frappe-bench
                  bench build --app ct_datalake
                  bench clear-cache
              fi
              if [ -d "/home/frappe/frappe-bench/apps/ct_agent_hub" ]; then
                  echo "🚀 Đăng ký App vào CT Agent Hub..."
                  cd /home/frappe/frappe-bench
                  bench --site uatapp.ctpai.vn execute ct_agent_hub.api.admin.auto_register_agent --args "{\"repo_name\": \"2as-master-profile\"}"
              fi
            '

  deploy-prod:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to PROD Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            su - frappe -c '
              export PATH=$PATH:/home/frappe/.local/bin
              source /home/frappe/frappe-env/bin/activate
              if [ ! -d "/home/frappe/frappe-bench/apps/ct_datalake" ]; then
                  echo "🚀 App ct_datalake chưa tồn tại. Đang tự động clone và cài đặt vào PROD..."
                  cd /home/frappe/frappe-bench/apps
                  git clone -b master https://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@github.com/CTGroup-DAIT/2as-master-profile.git ct_datalake
                  cd /home/frappe/frappe-bench
                  ./env/bin/pip install -q -U -e ./apps/ct_datalake
                  if ! grep -q "^ct_datalake$" sites/apps.txt; then echo "ct_datalake" >> sites/apps.txt; fi
                  bench --site app.ctpai.vn install-app ct_datalake
              fi
              cd /home/frappe/frappe-bench/apps/ct_datalake
              git clean -fd
              /home/frappe/deploy.sh ct_datalake master app.ctpai.vn
              FRONTEND_DIR=/home/frappe/frappe-bench/apps/ct_datalake/frontend
              if [ -d "$FRONTEND_DIR" ]; then
                  echo "📦 Phát hiện thư mục frontend độc lập, đang build..."
                  cd "$FRONTEND_DIR"
                  npm install
                  npm run build
                  cd /home/frappe/frappe-bench
                  bench build --app ct_datalake
                  bench clear-cache
              fi
              if [ -d "/home/frappe/frappe-bench/apps/ct_agent_hub" ]; then
                  echo "🚀 Đăng ký App vào CT Agent Hub..."
                  cd /home/frappe/frappe-bench
                  bench --site app.ctpai.vn execute ct_agent_hub.api.admin.auto_register_agent --args "{\"repo_name\": \"2as-master-profile\"}"
              fi
            '
